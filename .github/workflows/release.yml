name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The version comes from `git describe`, which needs the tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Releases reach every game server and never roll back, so only tags on main ship.
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew shadowJar
      # Another v2 tag on the same commit would make describe pick that one instead.
      - name: Check the built version matches the tag
        run: |
          built=$(unzip -p build/libs/rbw-hook.jar plugin.yml | sed -n 's/^version: //p')
          test "v$built" = "$GITHUB_REF_NAME" || { echo "built $built for $GITHUB_REF_NAME"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/libs
          sha256sum rbw-hook.jar > rbw-hook.jar.sha256
          gh release create "$GITHUB_REF_NAME" rbw-hook.jar rbw-hook.jar.sha256 --generate-notes
